---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-openbao-open-control-plane-io-v1alpha1-controlplaneentity
  failurePolicy: Fail
  name: vcontrolplaneentity.openbao.open-control-plane.io
  rules:
  - apiGroups:
    - openbao.open-control-plane.io
    apiVersions:
    - v1alpha1
    operations:
    - DELETE
    resources:
    - controlplaneentities
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-openbao-open-control-plane-io-v1alpha1-controlplanetrust
  failurePolicy: Fail
  name: vcontrolplanetrust.openbao.open-control-plane.io
  rules:
  - apiGroups:
    - openbao.open-control-plane.io
    apiVersions:
    - v1alpha1
    operations:
    - DELETE
    resources:
    - controlplanetrusts
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-openbao-open-control-plane-io-v1alpha1-projectentity
  failurePolicy: Fail
  name: vprojectentity.openbao.open-control-plane.io
  rules:
  - apiGroups:
    - openbao.open-control-plane.io
    apiVersions:
    - v1alpha1
    operations:
    - DELETE
    resources:
    - projectentities
  sideEffects: None
