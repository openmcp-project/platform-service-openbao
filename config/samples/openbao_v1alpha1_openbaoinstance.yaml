apiVersion: openbao.open-control-plane.io/v1alpha1
kind: OpenBaoInstance
metadata:
  labels:
    app.kubernetes.io/name: platform-service-openbao
    app.kubernetes.io/managed-by: kustomize
  name: default
spec:
  # Approved OpenBao API address. Tenants reference this instance by name;
  # they do not supply URLs themselves.
  address: https://openbao.example.com
  # Optional CA bundle. Reference a Secret or ConfigMap in the controller's
  # namespace containing a PEM bundle at spec.caBundleRef.key.
  # caBundleRef:
  #   name: openbao-ca
  #   key: ca.crt
  # Optional OpenBao namespace scoping.
  # namespace: openbao/tenants/mcp
  # Optional override for the auth-mount path prefix. Falls back to
  # ServiceConfig.spec.authMountPrefix when unset.
  # authMountPrefix: openbao
