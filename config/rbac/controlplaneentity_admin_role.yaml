# This rule is not used by the project platform-service-openbao itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over openbao.open-control-plane.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: platform-service-openbao
    app.kubernetes.io/managed-by: kustomize
  name: controlplaneentity-admin-role
rules:
- apiGroups:
  - openbao.open-control-plane.io
  resources:
  - controlplaneentities
  verbs:
  - '*'
- apiGroups:
  - openbao.open-control-plane.io
  resources:
  - controlplaneentities/status
  verbs:
  - get
