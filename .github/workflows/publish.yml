name: Publish

on:
  push:
    branches:
      - main

permissions: {}

# Serialize main publishes so tag creation and image push never race.
concurrency:
  group: publish-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: openmcp-project/platform-service-openbao

jobs:
  publish:
    name: Build and publish OCI image
    runs-on: ubuntu-latest
    permissions:
      contents: write # create and push the version tag
      packages: write # push the image to GHCR
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history is required to count commits for the deterministic version.
          fetch-depth: 0
          persist-credentials: true

      - name: Compute deterministic version
        id: version
        run: |
          COUNT="$(git rev-list --count HEAD)"
          VERSION="v0.0.0-alpha.${COUNT}"
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${VERSION} for commit #${COUNT} (${GITHUB_SHA})"

      - name: Create and push git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${VERSION} already exists, skipping tag creation"
          else
            git tag -a "${VERSION}" -m "Release ${VERSION}"
            git push origin "refs/tags/${VERSION}"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Persist the BuildKit layer cache in GitHub Actions cache to speed up
          # future builds (notably the go mod download layer).
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
