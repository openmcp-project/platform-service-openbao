name: Publish

on:
  push:
    branches:
      - main

permissions: {}

# Serialize main publishes so tag creation and image push never race.
concurrency:
  group: publish-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: openmcp-project/platform-service-openbao

jobs:
  publish:
    name: Build and publish OCI image
    runs-on: ubuntu-latest
    permissions:
      contents: write # create and push the version tag
      packages: write # push the image to GHCR
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required to count commits for the deterministic version.
          fetch-depth: 0
          persist-credentials: true

      - name: Compute deterministic version
        id: version
        run: |
          COUNT="$(git rev-list --count HEAD)"
          VERSION="v0.0.0-alpha.${COUNT}"
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${VERSION} for commit #${COUNT} (${GITHUB_SHA})"

      - name: Create and push git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${VERSION} already exists, skipping tag creation"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${VERSION}" -m "Release ${VERSION}"
            git push origin "refs/tags/${VERSION}"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Persist the BuildKit layer cache in GitHub Actions cache to speed up
          # future builds (notably the go mod download layer).
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
