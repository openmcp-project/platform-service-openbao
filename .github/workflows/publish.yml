name: Publish

on:
  push:
    branches:
      - main

permissions: {}

# Serialize main publishes so image pushes never race.
concurrency:
  group: publish-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: openmcp-project/platform-service-openbao

jobs:
  publish:
    name: Build and publish OCI image
    runs-on: ubuntu-latest
    permissions:
      contents: read # only reads the repo; no git tag is pushed
      packages: write # push the image to GHCR
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required to count commits for the deterministic version.
          fetch-depth: 0
          persist-credentials: false

      - name: Compute version
        id: version
        run: |
          COUNT="$(git rev-list --count HEAD)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          # SemVer with build metadata: the commit hash lives after '+'.
          VERSION="v0.0.0-alpha.${COUNT}+g${SHORT_SHA}"
          # OCI/Docker tags forbid '+', so the image tag uses the clean
          # pre-release only; the full '+g<sha>' version and the complete
          # commit SHA are recorded in OCI labels instead.
          IMAGE_TAG="v0.0.0-alpha.${COUNT}"
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${VERSION} for commit #${COUNT} (${GITHUB_SHA})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Provenance recorded as OCI labels: full '+g<sha>' version and the
          # complete commit SHA (revision), which tags cannot carry.
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # Persist the BuildKit layer cache in GitHub Actions cache to speed up
          # future builds (notably the go mod download layer).
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
