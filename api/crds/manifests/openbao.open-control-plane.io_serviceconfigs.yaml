  names:
    kind: ServiceConfig
    listKind: ServiceConfigList
    plural: serviceconfigs
    shortNames:
    - obsc
    singular: serviceconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ServiceConfig configures a running platform-service-openbao instance.
          Installed on the platform cluster. One instance per running controller,
          matched by --provider-name.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ServiceConfig
            properties:
              authMountPrefix:
                description: |-
                  authMountPrefix is prepended to deterministic per-ControlPlane auth
                  mount paths. Trailing slashes are stripped. Empty means default.
                maxLength: 64
                type: string
              platformCredentialRef:
                description: |-
                  platformCredentialRef optionally points at a Secret in the manager's
                  namespace holding the OpenBao token or credential the platform
                  controller uses to configure trust. Never surfaced in tenant status.
                properties:
                  key:
                    description: key is the key within the Secret's data.
                    minLength: 1
                    type: string
                  name:
                    description: name is the Secret name.
                    minLength: 1
                    type: string
                required:
                - key
                - name
                type: object
              requeueAfter:
