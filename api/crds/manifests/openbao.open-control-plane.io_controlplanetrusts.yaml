---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  labels:
    openmcp.cloud/cluster: onboarding
  name: controlplanetrusts.openbao.open-control-plane.io
spec:
  group: openbao.open-control-plane.io
  names:
    kind: ControlPlaneTrust
    listKind: ControlPlaneTrustList
    plural: controlplanetrusts
    shortNames:
    - cpt
    singular: controlplanetrust
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.controlPlaneRef.name
      name: ControlPlane
      type: string
    - jsonPath: .status.authMountPath
      name: AuthMount
      type: string
    - jsonPath: .status.conditions[?(@.type=='TrustConfigured')].status
      name: Trust
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ControlPlaneTrust configures OpenBao JWT auth mount + issuer/JWKS trust
          for a ControlPlane so its ServiceAccount tokens can log in to OpenBao.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ControlPlaneTrust
            properties:
              audience:
                description: |-
                  audience is the JWT audience to require on ControlPlane
                  ServiceAccount tokens presented to OpenBao. Empty means the
                  controller derives a stable default from ControlPlane identity.
                maxLength: 253
                type: string
              controlPlaneRef:
                description: |-
                  controlPlaneRef selects the target ControlPlane in the same namespace
                  as this ControlPlaneTrust. The controller uses an OpenMCP
                  AccessRequest to obtain access to that ControlPlane's API server for
                  issuer/JWKS discovery.
                properties:
                  name:
                    description: name is the name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              projectEntityRef:
                description: |-
                  projectEntityRef selects the ProjectEntity this trust belongs under.
                  The ProjectEntity determines which OpenBaoInstance is used.
                properties:
                  name:
                    description: name is the name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: namespace is the namespace of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
            required:
            - controlPlaneRef
            - projectEntityRef
            type: object
          status:
            description: status defines the observed state of ControlPlaneTrust
            properties:
              audience:
                description: |-
                  audience is the audience configured on the JWT auth mount. Mirrors
                  spec.audience once resolved.
                type: string
              authMountPath:
                description: |-
                  authMountPath is the OpenBao JWT auth mount path (without leading
                  "auth/") owned by this ControlPlaneTrust. Stable across reconciles
                  once assigned. This is the value users put into ESO SecretStore
                  configuration.
                type: string
              conditions:
                description: |-
                  conditions describe the current state of the ControlPlaneTrust.
                  Types used: "Ready", "DependencyReady", "TrustConfigured",
                  "OpenBaoReachable".
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              issuer:
                description: |-
                  issuer is the discovered OIDC/JWT issuer URL of the referenced
                  ControlPlane, as configured on the auth mount.
                type: string
              observedGeneration:
                description: |-
                  observedGeneration is the .metadata.generation the controller last
                  reconciled.
                format: int64
                type: integer
              resolvedOpenBaoInstance:
                description: |-
                  resolvedOpenBaoInstance is the OpenBaoInstance name inherited via
                  the ProjectEntity.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
