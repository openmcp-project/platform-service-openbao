---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  labels:
    openmcp.cloud/cluster: platform
  name: openbaoinstances.openbao.open-control-plane.io
spec:
  group: openbao.open-control-plane.io
  names:
    kind: OpenBaoInstance
    listKind: OpenBaoInstanceList
    plural: openbaoinstances
    shortNames:
    - obi
    singular: openbaoinstance
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.address
      name: Address
      type: string
    - jsonPath: .status.conditions[?(@.type=='OpenBaoReachable')].status
      name: Reachable
      type: string
    - jsonPath: .status.version
      name: Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OpenBaoInstance is a cluster-scoped registration of an approved OpenBao
          backend. Tenant resources reference it by name.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of OpenBaoInstance
            properties:
              address:
                description: address is the OpenBao API base URL (e.g. https://openbao.example.com).
                minLength: 1
                pattern: ^https?://.+
                type: string
              authMountPrefix:
                description: |-
                  authMountPrefix overrides the platform-wide default from
                  ServiceConfig for auth-mount paths generated against this instance.
                maxLength: 64
                type: string
              caBundleRef:
                description: |-
                  caBundleRef optionally references a Secret or ConfigMap in the
                  controller's namespace holding the PEM-encoded CA bundle used to
                  verify OpenBao's server certificate. When unset the system trust
                  store is used.
                properties:
                  key:
                    description: key is the key within the Secret's data.
                    minLength: 1
                    type: string
                  name:
                    description: name is the Secret name.
                    minLength: 1
                    type: string
                required:
                - key
                - name
                type: object
              insecureSkipVerify:
                description: |-
                  insecureSkipVerify disables TLS verification for this backend.
                  Intended for local development only; controllers SHOULD log a warning
                  when this is true.
                type: boolean
              namespace:
                description: |-
                  namespace is the OpenBao API namespace to scope operations to (for
                  OpenBao deployments that use namespaces). Empty means root.
                maxLength: 253
                type: string
            required:
            - address
            type: object
          status:
            description: status defines the observed state of OpenBaoInstance
            properties:
              conditions:
                description: |-
                  conditions describe the current state of the OpenBaoInstance. Types
                  used: "Ready", "OpenBaoReachable".
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              initialized:
                description: |-
                  initialized reflects the /sys/health `initialized` flag from the
                  last successful probe.
                type: boolean
              lastProbeTime:
                description: lastProbeTime is the timestamp of the most recent reachability
                  probe.
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  observedGeneration is the .metadata.generation the controller last
                  reconciled.
                format: int64
                type: integer
              sealed:
                description: |-
                  sealed reflects the /sys/health `sealed` flag from the last
                  successful probe. A sealed backend is unreachable for reconciliation
                  purposes.
                type: boolean
              version:
                description: version is the reported OpenBao server version, if discovered.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
