---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  labels:
    openmcp.cloud/cluster: onboarding
  name: policybindings.openbao.open-control-plane.io
spec:
  group: openbao.open-control-plane.io
  names:
    kind: PolicyBinding
    listKind: PolicyBindingList
    plural: policybindings
    shortNames:
    - pb
    singular: policybinding
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.controlPlaneEntityRef.name
      name: Entity
      type: string
    - jsonPath: .spec.policyName
      name: Policy
      type: string
    - jsonPath: .status.roleName
      name: Role
      type: string
    - jsonPath: .status.policyExists
      name: PolicyExists
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PolicyBinding owns exactly one OpenBao JWT role that binds a
          ControlPlaneEntity's ServiceAccount identity to one user-managed OpenBao
          policy name.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of PolicyBinding
            properties:
              controlPlaneEntityRef:
                description: |-
                  controlPlaneEntityRef selects the ControlPlaneEntity whose
                  ServiceAccount identity this binding grants access to. Must live in
                  the same namespace as the PolicyBinding.
                properties:
                  name:
                    description: name is the name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              maxTTL:
                description: |-
                  maxTTL overrides the JWT role's maximum token TTL. Empty means the
                  OpenBao default.
                pattern: ^([0-9]+(ns|us|µs|ms|s|m|h))+$
                type: string
              policyName:
                description: |-
                  policyName is the free-form name of a user-managed OpenBao policy.
                  The controller does not create, modify, or delete this policy; it
                  only names it on the generated JWT role. Missing policies surface as
                  a PolicyResolved=False status condition, not as admission rejection.
                maxLength: 253
                minLength: 1
                type: string
              ttl:
                description: |-
                  ttl overrides the JWT role's default token TTL. Empty means the
                  OpenBao default.
                pattern: ^([0-9]+(ns|us|µs|ms|s|m|h))+$
                type: string
            required:
            - controlPlaneEntityRef
            - policyName
            type: object
          status:
            description: status defines the observed state of PolicyBinding
            properties:
              authMountPath:
                description: |-
                  authMountPath is the OpenBao JWT auth mount path this binding's role
                  lives under. Inherited from the resolved ControlPlaneTrust.
                type: string
              conditions:
                description: |-
                  conditions describe the current state of the PolicyBinding. Types
                  used: "Ready", "DependencyReady", "PolicyResolved".
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  observedGeneration is the .metadata.generation the controller last
                  reconciled.
                format: int64
                type: integer
              policyExists:
                description: |-
                  policyExists reflects the last observed existence check for
                  spec.policyName in the resolved OpenBaoInstance.
                enum:
                - "True"
                - "False"
                - Unknown
                type: string
              policyName:
                description: policyName mirrors spec.policyName once resolved.
                type: string
              roleName:
                description: |-
                  roleName is the generated OpenBao JWT role name owned by this
                  binding. Deterministic and stable across reconciles.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
